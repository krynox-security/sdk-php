name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - run: composer validate --strict --no-check-publish
      - run: php -l src/KrynoxCaptcha.php
      - run: php -d zend.assertions=1 -d assert.exception=1 tests/contract.php
      - run: php -d zend.assertions=1 -d assert.exception=1 tests/integration.php
